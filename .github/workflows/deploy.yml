# ---------------------------------------------------------------
# Baut die Website und veröffentlicht sie auf Cloudflare Workers.
# Gleiches Muster wie reifenrol.
#
# Läuft bei jedem Push auf main. Reine Dokumentations-Commits lösen
# bewusst nichts aus (paths-ignore).
#
# Im Repository hinterlegen (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    Token mit Rechten für Workers (und DNS der Zone)
#   CLOUDFLARE_ACCOUNT_ID   Konto-Kennung aus dem Cloudflare-Dashboard
# ---------------------------------------------------------------

name: Auf Cloudflare veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# Zwei schnell aufeinanderfolgende Änderungen sollen sich nicht überholen.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Wrangler verlangt mindestens Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Voraussetzungen prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fehlt=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || fehlt="$fehlt\n  - Secret CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || fehlt="$fehlt\n  - Secret CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$fehlt" ]; then
            printf 'Es fehlen Angaben im Repository:%b\n\n' "$fehlt"
            echo 'Nachzutragen unter Settings → Secrets and variables → Actions.'
            exit 1
          fi

      - name: Pakete installieren
        run: npm ci

      - name: Website und Worker bauen
        run: npx opennextjs-cloudflare build

      # Lädt Worker, statische Dateien UND die vorgerenderten Seiten hoch.
      # Nicht durch `wrangler deploy` ersetzen — das lässt die vorgerenderten
      # Seiten weg, dann antworten die Inhaltsseiten mit 500.
      - name: Auf Cloudflare veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Erreichbarkeit prüfen
        run: |
          sleep 15
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://ib-behringer.de/")
          echo "Startseite antwortet mit $status"
          [ "$status" = "200" ] || echo "::warning::Noch kein 200 — bitte von Hand nachsehen."
